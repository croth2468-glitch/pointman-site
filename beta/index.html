<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Join the PointMan beta</title>
<link rel="icon" href="../favicon.svg" type="image/svg+xml">
<meta name="theme-color" content="#2E9E5B">
<meta property="og:type" content="website">
<meta property="og:title" content="PointMan: your next step starts here.">
<meta property="og:description" content="Free beta, 100 spots. A career coach on your phone that suggests career paths that fit you and builds a step-by-step plan with you.">
<meta property="og:url" content="https://pointman-coaching.com/beta/">
<meta property="og:image" content="https://pointman-coaching.com/pointman-demo-v4-poster.jpg">
<meta name="twitter:card" content="summary_large_image">
<style>
  :root{--bg:#FAF3E7;--card:#fff;--green:#2E9E5B;--green-d:#237a46;--text:#2B2A28;--muted:#5a544d;--line:#E6DCC8}
  @media (prefers-color-scheme:dark){:root{--bg:#1C1B1A;--card:#282623;--text:#F5EFE6;--muted:#B0A899;--line:#3a3733}}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px 16px}
  main{max-width:420px;width:100%;text-align:center}
  img{width:64px;height:64px}
  h1{font-size:28px;line-height:1.15;margin:16px 0 8px}
  p{color:var(--muted);font-size:16px;line-height:1.5;margin:0 0 22px}
  .btn{display:block;background:var(--green);color:#fff;text-decoration:none;font-weight:700;padding:15px 22px;border-radius:999px;font-size:16px;margin:0 0 12px;border:2px solid var(--green)}
  .btn.alt{background:transparent;color:var(--green)}
  .btn:hover{background:var(--green-d);color:#fff}
  .status{font-size:14px;min-height:20px;margin-top:10px}
  .back{display:inline-block;margin-top:18px;color:var(--muted);font-size:14px}
</style>
</head>
<body>
<main>
  <img src="../logo.svg" alt="PointMan">
  <h1>Your next step starts here.</h1>
  <p>The free PointMan beta is open, with 100 spots.</p>
  <a class="btn" id="ios" href="https://testflight.apple.com/join/UYXFVtMg">On iPhone: join on TestFlight</a>
  <a class="btn alt" id="web" href="/app/">Android or computer: web version</a>
  <div class="status" id="status" role="status" aria-live="polite"></div>
  <a class="back" href="/">What is PointMan?</a>
</main>
<script>
// Sends iPhone/iPad visitors to TestFlight and everyone else to the web app.
// Both buttons stay on the page in case the guess is wrong.
(function(){
  var ua=navigator.userAgent||'';
  var ios=/iPhone|iPad|iPod/.test(ua)||(/Macintosh/.test(ua)&&navigator.maxTouchPoints>1);
  var target=document.getElementById(ios?'ios':'web');
  if(/[?&]stay\b/.test(location.search))return;
  document.getElementById('status').textContent=ios?'Opening TestFlight…':'Opening the web version…';
  setTimeout(function(){location.href=target.href;},900);
})();
</script>
</body>
</html>
